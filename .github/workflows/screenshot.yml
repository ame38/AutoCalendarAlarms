name: screenshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/screenshot.yml'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x gradlew

      - run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install app, launch it, and capture a screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.ame38.autocalendaralarms android.permission.READ_CALENDAR
            adb shell pm grant com.ame38.autocalendaralarms android.permission.POST_NOTIFICATIONS
            adb shell appops set com.ame38.autocalendaralarms SCHEDULE_EXACT_ALARM allow
            adb shell appops set com.ame38.autocalendaralarms USE_FULL_SCREEN_INTENT allow
            adb shell dumpsys deviceidle whitelist +com.ame38.autocalendaralarms
            adb shell am start -n com.ame38.autocalendaralarms/.MainActivity
            sleep 8
            adb shell dumpsys window | grep mCurrentFocus
            adb exec-out screencap -p > screenshot-unmuted.png
            adb shell input tap 880 373
            sleep 1
            adb exec-out screencap -p > screenshot-muted.png
            adb logcat -d > logcat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screenshot-*.png

      - uses: actions/upload-artifact@v4
        with:
          name: app-logcat
          path: logcat.txt
