name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x gradlew

      - run: ./gradlew assembleDebug

      - name: rename apk with the tag
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoCalendarAlarms-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: AutoCalendarAlarms-${{ github.ref_name }}.apk
